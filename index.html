<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paradigm Pet Professionals</title>
</head>
<body>
    <!-- Navigation Bar -->
    <nav id="navBar">
        <img src="PPPLogo.png" alt="PPP Logo" class="logo">
        <ul class="navList">
            <li><a class="button active" href="index.html">Home</a></li>
            <li><a class="button" href="dog.html">Dogs</a></li>
            <li><a class="button" href="cat.html">Cats</a></li>
            <li><a class="button" href="birds.html">Birds</a></li>
            <li><a class="button" href="#contactForm">Contact</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <section id="homeContent">
        <p class="introText">Pets are nature's gift to humanity. Opening our homes and hearts to a pet increases our longevity and improves our overall quality of life...</p>
        <div class="petContent">
            <article class="petCard">
                <img src="dog.png" alt="Dogs">
                <a href="dog.html" class="button">Dogs</a>
            </article>
            <article class="petCard">
                <img src="bird.png" alt="Birds">
                <a href="birds.html" class="button">Birds</a>
            </article>
            <article class="petCard">
                <img src="cat.png" alt="Cats">
                <a href="cat.html" class="button">Cats</a>
            </article>
        </div>
    </section>

    <!-- Contact Form -->
    <section id="contactForm">
        <h2>Contact Us For a Consultation</h2>
        <form>
            <div class="formRow">
                <label for="fname">Owner First name:</label>
                <input type="text" id="fname" name="fname">
            </div>
            <div class="formRow">
                <label for="lname">Owner Last name:</label>
                <input type="text" id="lname" name="lname">
            </div>
            <div class="formRow">
                <label for="number">Phone Number:</label>
                <input type="text" id="number" name="number">
            </div>
            <div class="formRow">
                <label for="emailA">Email Address:</label>
                <input type="text" id="email" name="email">
            </div>
            <div class="formRow">
                <label for="time">Time Zone:</label>
                <input type="text" id="time" name="time">
            </div>
            <div class="formRow">
                <label for="petName">Pet Name:</label>
                <input type="text" id="petName" name="petName">
            </div>
            <div class="formRow">
                <label for="petAge">Pet Age:</label>
                <input type="text" id="petAge" name="petAge">
            </div>
            <div class="formRow">
                <label for="petType">Pet Type:</label>
                <input type="text" id="petType" name="petType">
            </div>
            <input class="button submitButton" type="submit" value="Submit">
        </form>
    </section>

    <!-- Footer -->
    <footer id="footer">
        <div class="footerContent">
            <ul class="navList">
                <li><a href="dog.html">Dogs</a></li>
                <li><a href="cat.html">Cats</a></li>
                <li><a href="birds.html">Birds</a></li>
                <li><a href="#contactForm">Contact</a></li>
            </ul>
            <img src="PPPoldLogo.png" alt="Old Logo" class="footerLogo">
        </div>
    </footer>

</body>
</html>
